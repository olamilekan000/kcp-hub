name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          fetch-depth: 0

      - name: Check commits are signed off
        run: hack/verify-dco.sh "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
