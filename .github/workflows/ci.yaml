name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # tag=v7.1.0
        with:
          python-version: "3.x"

      # shellcheck ships with the ubuntu runner image.
      - name: Install yamllint
        run: pip install yamllint

      - name: Lint
        run: make lint

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1

      - name: Install kind
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # tag=v1.15.2
        with:
          install_only: true

      # kubectl resolves these names through /etc/hosts, unlike curl,
      # which the scripts point at 127.0.0.1 themselves.
      - name: Resolve the platform's hostnames
        run: |
          echo "127.0.0.1 kcp.localhost root.kcp.localhost dex.kcp.localhost console.kcp.localhost" \
            | sudo tee -a /etc/hosts

      - name: Start the platform
        run: make up

      - name: Smoke test
        run: make test

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p logs
          kind export logs logs/kind --name kcp-hub || true
          export KUBECONFIG=.hub/kind.kubeconfig
          kubectl get pods -A -o wide >logs/pods.txt 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp >logs/events.txt 2>&1 || true
          for ns in kcp dex kcp-operator-system; do
            for pod in $(kubectl -n "$ns" get pods -o name 2>/dev/null); do
              kubectl -n "$ns" logs "$pod" --all-containers >"logs/$ns-${pod#pod/}.log" 2>&1 || true
            done
          done

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag=v7.0.2
        with:
          name: smoke-logs
          path: logs/

  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1

      - name: Check markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # tag=v2.9.0
        with:
          args: --no-progress './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
