{{- if .Values.console.enabled }}
{{- if not .Values.oidc.issuerURL }}
{{- fail "the console signs users in through OIDC: set oidc.issuerURL, or console.enabled=false" }}
{{- end }}
# The web console. Its server serves the UI and passes /services and
# /clusters on to kcp's front-proxy with the user's own token, so the
# browser stays on one origin and the console holds no credential.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: console-tls
spec:
  secretName: console-tls
  dnsNames:
    - {{ include "hub.consoleHostname" . }}
  issuerRef:
    {{- include "hub.consoleIssuerRef" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  labels:
    app: console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: console
  template:
    metadata:
      labels:
        app: console
    spec:
      containers:
        - name: console
          image: {{ .Values.console.image.repository }}:{{ .Values.console.image.tag }}
          imagePullPolicy: {{ .Values.console.image.pullPolicy }}
          args:
            - --address=:8443
            - --tls-cert-file=/etc/console/tls/tls.crt
            - --tls-key-file=/etc/console/tls/tls.key
            - --upstream=https://frontproxy-front-proxy.{{ .Release.Namespace }}.svc.cluster.local:8443
            - --upstream-ca-file=/etc/console/kcp-ca/ca.crt
            # The same CA signs the front-proxy's public certificate, which
            # users reach through the gateway's passthrough.
            - --kcp-ca-file=/etc/console/kcp-ca/ca.crt
          env:
            # Shown to users in instructions, so it is kcp's public address.
            - name: CONSOLE_KCP_SERVER
              value: https://{{ .Values.hostname }}:{{ .Values.port }}
            - name: CONSOLE_OIDC_ISSUER
              value: {{ .Values.oidc.issuerURL }}
            - name: CONSOLE_OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientID }}
            - name: CONSOLE_OIDC_SCOPES
              value: {{ .Values.console.oidcScopes }}
          ports:
            - containerPort: 8443
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: 8443
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: tls
              mountPath: /etc/console/tls
              readOnly: true
            - name: kcp-ca
              mountPath: /etc/console/kcp-ca
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: console-tls
        # Only the certificate of the CA that signs the front-proxy's
        # serving certificate, not its key.
        - name: kcp-ca
          secret:
            secretName: root-server-ca
            items:
              - key: tls.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: console
spec:
  selector:
    app: console
  ports:
    - port: 8443
      targetPort: 8443
{{- end }}
