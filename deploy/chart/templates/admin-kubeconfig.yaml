# system:kcp:admin rather than system:masters: kcp records the creator of a
# workspace as its owner only for identities that are not system-privileged,
# and new workspaces need an owner to finish initializing.
apiVersion: operator.kcp.io/v1alpha1
kind: Kubeconfig
metadata:
  name: admin
spec:
  username: kcp-admin
  groups:
    - system:kcp:admin
  validity: 8766h
  secretRef:
    name: kcp-admin-kubeconfig
  target:
    frontProxyRef:
      name: frontproxy
