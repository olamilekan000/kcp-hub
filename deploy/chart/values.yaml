# Settings for installing kcp hub into a cluster. deploy/local/values.yaml
# holds the ones make up uses.

# The hostname users and tools reach kcp at. The root shard is reached at
# root.<hostname>. Both have to point at the gateway below.
hostname: kcp.example.com
# The port on that hostname.
port: 443

kcp:
  # The kcp image tag, for the shard and the front-proxy.
  tag: main
  # etcd that kcp stores its data in.
  etcdEndpoints:
    - http://etcd.kcp-etcd.svc.cluster.local:2379

# The tenancy and marketplace images, from contrib-virtual-workspaces.
contrib:
  repository: ghcr.io/kcp-dev/contrib-virtual-workspaces
  # 0.2.0 for release v0.2.0, sha-<commit> for a commit.
  tag: ""

# Who may manage tenants and the producer catalog. Each entry is a user or
# group as kcp sees it, so with OIDC the value of the username or groups
# claim.
platformAdmins:
  users: []
  groups: []

tenancy:
  # Lets a signed-in user request their own tenant, without waiting for a
  # platform admin.
  selfServiceTenants: false

# The web console. It signs users in through the OIDC provider below, so
# it needs oidc.issuerURL.
console:
  enabled: true
  # Defaults to console.<hostname>. It has to point at the gateway too.
  hostname: ""
  image:
    repository: ghcr.io/olamilekan000/kcp-hub/console
    tag: main
    pullPolicy: IfNotPresent
  # The scopes the console asks the OIDC provider for. The ID token has to
  # carry the username and groups claims set under oidc.
  oidcScopes: openid email groups
  tls:
    # The cert-manager issuer of the console's certificate. Browsers have
    # to trust it, so use one such as Let's Encrypt or your company's CA.
    # Empty uses a self-signed certificate, which browsers warn about.
    issuerRef: {}
    #   group: cert-manager.io
    #   kind: ClusterIssuer
    #   name: letsencrypt

tls:
  # The cert-manager issuer kcp-operator creates kcp's CA from. Empty
  # creates a self-signed Issuer in the release namespace.
  issuerRef: {}
  #   group: cert-manager.io
  #   kind: ClusterIssuer
  #   name: my-issuer

# The OpenID Connect provider users sign in with. Without an issuerURL,
# kcp accepts only certificates and service account tokens.
oidc:
  issuerURL: ""
  clientID: kcp
  usernameClaim: email
  groupsClaim: groups
  # A Secret in the release namespace with the CA of the issuer's
  # certificate, when that is not publicly trusted.
  caSecret:
    name: ""
    key: ca.crt

# The Gateway API gateway that routes the hostnames to kcp. It needs a TLS
# passthrough listener, because kcp terminates TLS itself.
gateway:
  enabled: true
  parentRef:
    name: ""
    namespace: ""

# Extra /etc/hosts entries for kcp's pods, for when the hostnames do not
# resolve to the gateway from inside the cluster.
hostAliases: []
#  - ip: 10.0.0.1
#    hostnames: [kcp.example.com, root.kcp.example.com]
