# Port 8443 on the host goes straight to the gateway's node port, so the
# platform stays reachable without a port-forward running in the background.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30443
        hostPort: 8443
        listenAddress: 127.0.0.1
        protocol: TCP
