# Dex, the OIDC issuer for local development, at
# https://dex.kcp.localhost:8443/dex. The host reaches it through the
# gateway on port 8443 and the kcp pods through the gateway's cluster
# address (hostAliases in deploy/local/kcp), so the issuer URL is the same
# for both.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dex
---
# Kubernetes storage: Dex creates its CRDs on first start and keeps its
# signing keys in them, so a restart does not invalidate every token kcp
# has already seen.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dex
rules:
  - apiGroups: ["dex.coreos.com"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dex
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dex
subjects:
  - kind: ServiceAccount
    name: dex
    namespace: dex
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dex
data:
  config.yaml: |
    issuer: https://dex.kcp.localhost:8443/dex
    storage:
      type: kubernetes
      config:
        inCluster: true
    web:
      https: 0.0.0.0:5556
      tlsCert: /etc/dex/tls/tls.crt
      tlsKey: /etc/dex/tls/tls.key
      # The console's dev server calls Dex from its own origin.
      allowedOrigins:
        - http://localhost:5173
      allowedHeaders:
        - Content-Type
        - Authorization
    oauth2:
      # Lets scripts get a token without a browser (hack/token.sh).
      passwordConnector: local
      skipApprovalScreen: true
    staticClients:
      # Public, because the CLI and the console run on the user's machine
      # and cannot keep a secret; they use PKCE instead.
      - id: kcp
        name: kcp
        public: true
        redirectURIs:
          - http://localhost:8000/callback
          - http://localhost:5173/callback
    enablePasswordDB: true
    # Every hash is bcrypt("password").
    staticPasswords:
      - email: admin@platform.example.com
        hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
        username: admin
        userID: "4"
      - email: alice@team-a.example.com
        hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
        username: alice
        userID: "1"
      - email: bob@team-b.example.com
        hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
        username: bob
        userID: "2"
      - email: mallory@strangers.example.com
        hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
        username: mallory
        userID: "3"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  labels:
    app: dex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dex
  template:
    metadata:
      labels:
        app: dex
    spec:
      serviceAccountName: dex
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.46.1
          command: ["/usr/local/bin/dex", "serve", "/etc/dex/cfg/config.yaml"]
          ports:
            - containerPort: 5556
          volumeMounts:
            - name: config
              mountPath: /etc/dex/cfg
              readOnly: true
            - name: tls
              mountPath: /etc/dex/tls
              readOnly: true
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /dex/healthz
              port: 5556
      volumes:
        - name: config
          configMap:
            name: dex
        - name: tls
          secret:
            secretName: dex-tls
---
apiVersion: v1
kind: Service
metadata:
  name: dex
spec:
  selector:
    app: dex
  ports:
    - port: 5556
      targetPort: 5556
---
apiVersion: gateway.networking.k8s.io/v1alpha3
kind: TLSRoute
metadata:
  name: dex
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
  hostnames:
    - dex.kcp.localhost
  rules:
    - backendRefs:
        - name: dex
          port: 5556
