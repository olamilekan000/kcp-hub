# Dex serves its own TLS, with a certificate from the local CA in
# deploy/local/ca. kcp trusts that CA through its copy, the hub-ca secret in
# the kcp namespace, which hack/up.sh writes.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dex-tls
spec:
  secretName: dex-tls
  dnsNames:
    - dex.kcp.localhost
  issuerRef:
    name: hub-ca
    kind: ClusterIssuer
