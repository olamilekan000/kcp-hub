# The tenancy virtual workspace, which the front-proxy serves at
# /services/tenancy. kcp-operator runs it as a Deployment and Service named
# tenancy-virtual-workspace. Its init container sets tenancy up in kcp
# before the server starts.
apiVersion: operator.kcp.io/v1alpha1
kind: VirtualWorkspace
metadata:
  name: tenancy
spec:
  target:
    rootShardRef:
      name: root
  external:
    hostname: kcp.localhost
    port: 8443
  # Keep in step with the operator Deployment and TENANCY_IMAGE in
  # hack/up.sh.
  image:
    repository: ghcr.io/kcp-dev/contrib-virtual-workspaces/tenancy-vw
    tag: sha-14476ca92695431da25bfb43762ccadf1d5a954a
  # The operator's default is two replicas requesting a CPU each, which a
  # one-node kind cluster cannot spare.
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  command: ["/tenancy-vw", "virtualworkspace"]
  kubeconfigSecretRef:
    name: tenancy-vw-kubeconfig
  initContainers:
    - name: init
      command: ["/tenancy-vw", "init"]
      kubeconfigSecretRef:
        name: tenancy-bootstrap-kubeconfig
      args:
        - --kubeconfig=/etc/kcp/init-kubeconfig/kubeconfig
        - --server-user=tenancy-vw
        - --server-user=tenancy-operator
        - --platform-admin-user=admin@platform.example.com
  extraArgs:
    - --endpoint-base=https://kcp.localhost:8443/clusters/
    # Lets a signed-in user request their own tenant, without waiting for a
    # platform admin.
    - --self-service-tenants
    # Must match kcp's OIDC settings, so a token names the same user here
    # as it does in kcp.
    - --oidc-issuer-url=https://dex.kcp.localhost:8443/dex
    - --oidc-client-id=kcp
    - --oidc-username-claim=email
    - --oidc-groups-claim=groups
    - --oidc-ca-file=/etc/dex/ca.crt
  extraVolumes:
    - name: hub-ca
      secret:
        secretName: hub-ca
  extraVolumeMounts:
    - name: hub-ca
      mountPath: /etc/dex
      readOnly: true
  deploymentTemplate:
    spec:
      template:
        spec:
          hostAliases:
            - ip: 10.96.2.2
              hostnames:
                - kcp.localhost
                - root.kcp.localhost
                - dex.kcp.localhost
