# Three identities, so each part of tenancy holds only what it needs.
#
# init runs once to create the tenancy workspaces and exports, which takes
# an admin. It then grants the server role to the other two, whose reach
# is exactly what the tenancy exports give them.
apiVersion: operator.kcp.io/v1alpha1
kind: Kubeconfig
metadata:
  name: tenancy-bootstrap
spec:
  username: kcp-admin
  groups:
    - system:kcp:admin
  validity: 8766h
  secretRef:
    name: tenancy-bootstrap-kubeconfig
  target:
    frontProxyRef:
      name: frontproxy
---
apiVersion: operator.kcp.io/v1alpha1
kind: Kubeconfig
metadata:
  name: tenancy-vw
spec:
  username: tenancy-vw
  validity: 8766h
  targetWorkspace: root:tenancy:controllers
  secretRef:
    name: tenancy-vw-kubeconfig
  target:
    frontProxyRef:
      name: frontproxy
---
apiVersion: operator.kcp.io/v1alpha1
kind: Kubeconfig
metadata:
  name: tenancy-operator
spec:
  username: tenancy-operator
  validity: 8766h
  secretRef:
    name: tenancy-operator-kubeconfig
  target:
    frontProxyRef:
      name: frontproxy
