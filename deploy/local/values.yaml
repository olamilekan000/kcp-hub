# The chart settings make up uses for the kind cluster.
hostname: kcp.localhost
port: 8443

# contrib.tag is set by hack/up.sh from versions.env.

# A user in Dex's static passwords (see deploy/local/dex/dex.yaml).
platformAdmins:
  users:
    - admin@platform.example.com

tenancy:
  selfServiceTenants: true

# hack/up.sh sets console.image to the image it builds or pulls.
console:
  tls:
    # The local CA, which browsers are asked to trust (see the README).
    issuerRef:
      group: cert-manager.io
      kind: ClusterIssuer
      name: hub-ca

oidc:
  issuerURL: https://dex.kcp.localhost:8443/dex
  # Dex's certificate comes from the local CA, which hack/up.sh copies here.
  caSecret:
    name: hub-ca

gateway:
  parentRef:
    name: eg
    namespace: envoy-gateway-system

# The gateway's address (see deploy/local/gateway.yaml). Pods reach the
# kcp and Dex hostnames through it, the same way the host does on port 8443.
hostAliases:
  - ip: 10.96.2.2
    hostnames:
      - kcp.localhost
      - root.kcp.localhost
      - dex.kcp.localhost
