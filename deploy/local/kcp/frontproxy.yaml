apiVersion: operator.kcp.io/v1alpha1
kind: FrontProxy
metadata:
  name: frontproxy
spec:
  rootShard:
    ref:
      name: root
  external:
    hostname: kcp.localhost
    port: 8443
  image:
    tag: main
  certificateTemplates:
    server:
      spec:
        dnsNames:
          - kcp.localhost
  auth:
    serviceAccount:
      enabled: true
    oidc:
      issuerURL: https://dex.kcp.localhost:8443/dex
      clientID: kcp
      usernameClaim: email
      groupsClaim: groups
      # key is documented to default to ca.crt, but the operator does not
      # apply that default and the front-proxy then fails to start.
      caFileRef:
        name: dex-ca
        key: ca.crt
  deploymentTemplate:
    spec:
      template:
        spec:
          hostAliases:
            - ip: 10.96.2.2
              hostnames:
                - kcp.localhost
                - root.kcp.localhost
                - dex.kcp.localhost
