apiVersion: operator.kcp.io/v1alpha1
kind: FrontProxy
metadata:
  name: frontproxy
spec:
  rootShard:
    ref:
      name: root
  external:
    hostname: kcp.localhost
    port: 8443
  image:
    tag: main
  certificateTemplates:
    server:
      spec:
        dnsNames:
          - kcp.localhost
  auth:
    serviceAccount:
      enabled: true
    oidc:
      issuerURL: https://dex.kcp.localhost:8443/dex
      clientID: kcp
      usernameClaim: email
      groupsClaim: groups
      # key is documented to default to ca.crt, but the operator does not
      # apply that default and the front-proxy then fails to start.
      caFileRef:
        name: hub-ca
        key: ca.crt
  # The virtual workspaces, each at the path it owns. The front-proxy
  # authenticates the caller and passes their identity on in headers,
  # signed with its requestheader client certificate.
  additionalPathMappings:
    - path: /services/tenancy
      backend: https://tenancy-virtual-workspace.kcp.svc.cluster.local:6443
      backend_server_ca: /etc/kcp/tls/ca/tls.crt
      proxy_client_cert: /etc/kcp-front-proxy/requestheader-client/tls.crt
      proxy_client_key: /etc/kcp-front-proxy/requestheader-client/tls.key
    - path: /services/marketplace
      backend: https://marketplace-virtual-workspace.kcp.svc.cluster.local:6443
      backend_server_ca: /etc/kcp/tls/ca/tls.crt
      proxy_client_cert: /etc/kcp-front-proxy/requestheader-client/tls.crt
      proxy_client_key: /etc/kcp-front-proxy/requestheader-client/tls.key
  deploymentTemplate:
    spec:
      template:
        spec:
          hostAliases:
            - ip: 10.96.2.2
              hostnames:
                - kcp.localhost
                - root.kcp.localhost
                - dex.kcp.localhost
