# Three identities, as for tenancy: init needs an admin to create the
# marketplace workspaces and exports, then grants the server role to the
# virtual workspace and the operator, whose reach is exactly what the
# marketplace exports give them.
apiVersion: operator.kcp.io/v1alpha1
kind: Kubeconfig
metadata:
  name: marketplace-bootstrap
spec:
  username: kcp-admin
  groups:
    - system:kcp:admin
  validity: 8766h
  secretRef:
    name: marketplace-bootstrap-kubeconfig
  target:
    frontProxyRef:
      name: frontproxy
---
apiVersion: operator.kcp.io/v1alpha1
kind: Kubeconfig
metadata:
  name: marketplace-vw
spec:
  username: marketplace-vw
  validity: 8766h
  targetWorkspace: root:marketplace:controllers
  secretRef:
    name: marketplace-vw-kubeconfig
  target:
    frontProxyRef:
      name: frontproxy
---
apiVersion: operator.kcp.io/v1alpha1
kind: Kubeconfig
metadata:
  name: marketplace-operator
spec:
  username: marketplace-operator
  validity: 8766h
  secretRef:
    name: marketplace-operator-kubeconfig
  target:
    frontProxyRef:
      name: frontproxy
