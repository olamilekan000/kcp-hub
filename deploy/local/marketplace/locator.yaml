# Applied inside kcp, in root:marketplace:catalog and
# root:marketplace:producers, after init has created them.
#
# The operator has to know which logical clusters these workspaces are,
# because the marketplace exports address clusters rather than paths, and
# init does not grant that. This is the narrow role tenancy's init uses for
# the same purpose: enter the workspace and read where you are.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: marketplace.platform.kcp.io:locator
rules:
  - nonResourceURLs: ["/"]
    verbs: ["access"]
  - apiGroups: ["core.kcp.io"]
    resources: ["logicalclusters"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: marketplace.platform.kcp.io:locator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: marketplace.platform.kcp.io:locator
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: marketplace-operator
